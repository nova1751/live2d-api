name: Verify and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: pnpm install --frozen-lockfile
      - name: Build the npm tarball
        run: npm pack --pack-destination "$RUNNER_TEMP" --silent
      - name: Check committed CDN files match the build
        run: test -z "$(git status --porcelain)"
      - run: pnpm test
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      - name: Render the widget from the packed files
        run: |
          tar -xzf "$RUNNER_TEMP"/live2dapi-noa-*.tgz -C "$RUNNER_TEMP"
          node scripts/check-runtime-package.mjs "$RUNNER_TEMP/package"
          # The smoke site serves the packed JS with a separate on-disk collection of test models.
          cp -r model model_list.json index.html "$RUNNER_TEMP/package/"
          pnpm run test:browser "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: npm-package
          path: ${{ runner.temp }}/live2dapi-noa-*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/release
      - name: Publish verified tarball using npm trusted publishing
        run: |
          dist_tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist_tag=next; fi
          npm publish "$RUNNER_TEMP"/release/*.tgz --access public --provenance --ignore-scripts --tag "$dist_tag"
