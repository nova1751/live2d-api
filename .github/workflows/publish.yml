name: Verify and publish GitHub runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: pnpm install --frozen-lockfile
      - name: Build the npm tarball
        run: npm pack --pack-destination "$RUNNER_TEMP" --silent
      - name: Check committed CDN files match the build
        run: test -z "$(git status --porcelain)"
      - run: pnpm test
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      - name: Render the widget from the packed files
        run: |
          tar -xzf "$RUNNER_TEMP"/live2dapi-noa-*.tgz -C "$RUNNER_TEMP"
          node scripts/check-runtime-package.mts "$RUNNER_TEMP/package"
          # The smoke site serves the packed JS with a separate on-disk collection of test models.
          cp -r model model_list.json index.html "$RUNNER_TEMP/package/"
          pnpm run test:browser "$RUNNER_TEMP/package"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Publish immutable catalog and runtime snapshots
        run: |
          node scripts/publish-library.mts --publish
          node scripts/publish-widget.mts --publish
