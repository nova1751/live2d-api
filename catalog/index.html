<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1412" media="(prefers-color-scheme: dark)">
  <title data-en="Live2D model gallery">Live2D 模型图鉴</title>
  <meta name="description" content="在线预览少女前线、碧蓝航线、BanG Dream! 等作品的 Live2D 模型，试播动作，并一行代码嵌入你的网站。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Live2D 模型图鉴">
  <meta property="og:description" content="在线预览 Live2D 模型、试播动作，并一行代码嵌入你的网站。">
  <meta property="og:image" content="https://cdn.jsdmirror.com/gh/nova1751/live2d-api@v2.9.9/docs/assets/readme/cover.webp">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    (function () {
      var root = document.documentElement;
      try { var theme = localStorage.getItem('live2d-gallery-theme'); if (theme === 'light' || theme === 'dark') root.dataset.theme = theme; } catch (e) {}
      // Start the catalog download before the page script asks for it.
      var game = new URLSearchParams(location.search).get('collection');
      var games = ['azur-lane', 'bang-dream', 'houkai2', 'iron-saga', 'warship-girls', 'baoshi-yanwuyu'];
      var link = document.createElement('link');
      link.rel = 'preload'; link.as = 'fetch'; link.crossOrigin = 'anonymous';
      link.href = games.indexOf(game) < 0 ? './library.json' : './games/' + game + '.json';
      document.head.appendChild(link);
    })();
  </script>
  <link rel="modulepreload" href="../widget.mjs">
  <link rel="preload" href="../jsdelivr/sequential/waifu-tips.js" as="script">
  <link rel="preload" href="../css/left.css" as="style">
  <link rel="preconnect" href="https://cdn.jsdmirror.com" crossorigin>
  <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
  <link rel="dns-prefetch" href="https://cubism.live2d.com">
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <header class="masthead"><div class="wrap mast">
    <a class="brand" href="#top"><span class="mark" aria-hidden="true"></span><span>Live2D</span> <span data-en="Gallery">图鉴</span></a>
    <nav aria-label="项目导航" data-en-aria-label="Project navigation">
      <a class="nav-anchor" href="#collection" data-en="Gallery">图鉴</a>
      <a id="embed-guide" href="https://github.com/nova1751/live2d-api/blob/main/README.md#快速接入" data-en="Embed ↗">网页接入 ↗</a>
      <a id="language" href="?lang=en" lang="en" hreflang="en">English</a>
      <button id="theme" class="icon-btn" type="button" aria-label="切换到深色模式" data-en-aria-label="Switch to dark mode"><span aria-hidden="true"></span></button>
    </nav>
  </div></header>
  <main class="wrap" id="top">
    <nav id="games" class="games" aria-label="作品" data-en-aria-label="Collections">
      <a href="?collection=girls-frontline" data-game="girls-frontline" data-en="Girls’ Frontline">少女前线</a>
      <a href="?collection=azur-lane" data-game="azur-lane" data-en="Azur Lane">碧蓝航线</a>
      <a href="?collection=bang-dream" data-game="bang-dream">BanG Dream!</a>
      <a href="?collection=houkai2" data-game="houkai2" data-en="Guns GirlZ">崩坏学园 2</a>
      <a href="?collection=iron-saga" data-game="iron-saga" data-en="Iron Saga">机动战队</a>
      <a href="?collection=warship-girls" data-game="warship-girls" data-en="Warship Girls R">战舰少女 R</a>
      <a href="?collection=baoshi-yanwuyu" data-game="baoshi-yanwuyu" data-en="Baoshi Yanwuyu">宝石研物语</a>
    </nav>
    <div class="intro">
      <div><h1><b data-en="Girls’ Frontline">少女前线</b><span data-en="Model gallery">模型图鉴</span></h1>
      <p class="lede" data-en="Pick a character to preview it live, try its actions, then embed the collection with one line of code.">点选角色即可实时预览、试播动作，再用一行代码把整部作品嵌入你的网站。</p></div>
      <p id="totals"></p>
    </div>
    <div class="layout">
      <section class="preview-panel" aria-labelledby="model-name">
        <div class="stage" id="stage">
          <span class="stage-label" data-en="Live2D preview">Live2D 预览</span>
          <img id="poster" alt="" hidden>
          <div class="model-host" id="model-host"></div>
        </div>
        <div class="profile">
          <p class="kind" id="model-category"></p>
          <h2 id="model-name" data-en="Loading model">正在载入模型</h2>
          <p id="result" role="status"></p>
          <label for="variant" data-en="Current outfit">当前造型</label><select id="variant" disabled></select>
          <div id="audition" hidden><label for="motion" data-en="Preview an action">动作预览</label><div class="motion">
            <select id="motion" aria-label="动作" data-en-aria-label="Action"></select><button id="play-motion" class="btn primary" type="button" data-en="Play">播放</button>
          </div></div>
          <div class="links"><button id="share" class="btn" type="button" data-en="Copy preview link">复制预览链接</button><a id="manifest" hidden data-en="Model manifest ↗">模型清单 ↗</a></div>
          <details class="embed" id="embed">
            <summary data-en="Embed this collection">嵌入这部作品</summary>
            <pre><code id="embed-code"></code></pre>
            <div class="embed-foot"><span data-en="Paste before &lt;/body&gt;.">放在网页的 &lt;/body&gt; 前即可。</span><button id="copy-embed" class="btn" type="button" data-en="Copy code">复制代码</button></div>
          </details>
          <p id="notice" role="status"></p>
        </div>
      </section>
      <section id="collection" aria-labelledby="collection-title">
        <div class="toolbar">
          <div class="collection-head"><h2 id="collection-title" data-en="Explore the collection">浏览图鉴</h2>
            <div class="modes" aria-label="浏览方式" data-en-aria-label="Browse by"><button type="button" id="by-character" aria-pressed="true" data-en="Characters">按人物</button><button type="button" id="by-form" aria-pressed="false" data-en="Outfits">按造型</button></div>
          </div>
          <div class="filters"><label class="search"><span aria-hidden="true"></span><input id="search" type="search" aria-label="搜索人物、造型或代号" data-en-aria-label="Search characters, outfits or IDs" placeholder="搜索人物、造型或代号" data-en-placeholder="Search characters, outfits or IDs"></label>
            <select id="category" aria-label="按分类筛选" data-en-aria-label="Filter by category"><option value="" data-en="All categories">全部分类</option></select>
          </div>
          <p id="matches" role="status"></p>
        </div>
        <div id="cards" class="cards" aria-label="模型列表" data-en-aria-label="Model list" aria-busy="true">
          <span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span><span class="card skeleton" aria-hidden="true"><span class="art"></span><span class="caption"><strong></strong><small></small></span></span>
        </div>
        <div class="paging"><button id="more" class="btn" type="button" hidden data-en="Show more">显示更多</button></div>
      </section>
    </div>
  </main>
  <footer class="wrap foot">
    <span>Live2D API · <a href="https://github.com/nova1751/live2d-api">GitHub</a> · <a href="https://www.npmjs.com/package/live2dapi-noa">npm</a></span>
    <span data-en="Model art and voices belong to their respective rights holders.">模型美术与语音版权归各自权利方所有。</span>
  </footer>
  <script>
    // Runs before first paint: language, active collection and heading, so switching collections
    // never flashes the default text while the module graph loads.
    (function () {
      var params = new URLSearchParams(location.search);
      var english = params.get('lang') === 'en';
      var root = document.documentElement;
      if (english) {
        root.lang = 'en';
        document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.dataset.en; });
        ['aria-label', 'placeholder', 'alt'].forEach(function (name) {
          document.querySelectorAll('[data-en-' + name + ']').forEach(function (el) { el.setAttribute(name, el.getAttribute('data-en-' + name)); });
        });
        document.getElementById('embed-guide').href = 'https://github.com/nova1751/live2d-api/blob/main/docs/en/README.md#quick-start';
        var language = document.getElementById('language');
        language.textContent = '简体中文';
        language.lang = language.hreflang = 'zh-CN';
      }
      var links = document.querySelectorAll('[data-game]');
      var active = links[0];
      links.forEach(function (link) {
        if (link.dataset.game === params.get('collection')) active = link;
        if (english) link.search += '&lang=en';
      });
      active.setAttribute('aria-current', 'page');
      document.querySelector('.intro h1 b').textContent = active.textContent;
      document.title = active.textContent + (english ? ' model gallery · Live2D' : '模型图鉴 · Live2D');
    })();
  </script>
  <script type="module" src="./browser.mjs"></script>
</body>
</html>
